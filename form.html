<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PraRoz - Web Design Course</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #001428 0%, #002850 100%);
            min-height: 100vh;
            color: #fff;
        }

        /* Main container using flex - two columns */
        .container {
            display: flex;
            min-height: 100vh;
            padding: 60px 50px;
            gap: 80px;
            align-items: center;
        }

        /* Left column - text content */
        .left-content {
            flex: 1;
        }

        .left-content h2 {
            font-size: 48px;
            margin-bottom: 0;
            color: #fff;
        }

        .left-content h1 {
            font-size: 80px;
            color: #ff8c00;
            margin: 0;
            font-weight: bold;
        }

        .left-content p {
            font-size: 16px;
            line-height: 1.8;
            margin: 30px 0;
            color: #ccc;
        }

        .left-content button {
            padding: 15px 40px;
            background-color: #ff8c00;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .left-content button:hover {
            background-color: #ff7700;
        }

        /* Right column - login form */
        .right-content {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 10px;
        }

        .login-form h3 {
            text-align: center;
            color: #ff8c00;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 2px solid #555;
            background: transparent;
            color: #fff;
            font-size: 14px;
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-group input:focus {
            outline: none;
            border-bottom-color: #ff8c00;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #ff8c00;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: #ff7700;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #ccc;
        }

        .signup-link a {
            color: #ff8c00;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- Main container with flex layout -->
    <div class="container">
        <!-- Left column - existing content -->
        <div class="left-content">
            <h2>Web Design &</h2>
            <h1>Development</h1>
            <h2>Course</h2>
            <p>Web Design is a specialisation of the design stream.They also use HTML.<br>CSS,WYS/WYG editing software, mark up validators etx..'<br>to create design elements</p>
            <button>Join US</button>
        </div>

        <!-- Right column - login form -->
        <div class="right-content">
            <form class="login-form">
                <h3>Login Here</h3>
                <div class="form-group">
                    <input type="email" placeholder="Enter Email Here" required>
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Enter Password Here" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
                <div class="signup-link">
                    Don't have an account? <a href="#">Sign up</a> here
                </div>
            </form>
        </div>
    </div>
</body>
</html>

name: Pass inputs
on: push
env: 
  z: 10
jobs:
  run_Script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codew
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: run script
        run: python Scripts/practice.py ${{ env.z }} > output.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with: 
          name: python-output
          path: output.txt
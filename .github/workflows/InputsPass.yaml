name: Pass inputs
on: push
env: 
  a: 10
  b: 20
jobs:
  run_Script:
    env:
      a: 30
      b: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codew
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: run script
        env:
          a: 5
          b: 30
        run: |
          echo "Worflow level a=$workflow_a"
          echo "Job level a=$job_a"
          echo "Step level a=$step_a"
          python Scripts/practice.py ${{ env.b }} $a